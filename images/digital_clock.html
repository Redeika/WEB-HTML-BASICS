<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #b8e0d2;
        }

        .clock-box {
            background: #f5fffb;
            width: 380px;
            padding: 35px;
            text-align: center;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(60, 110, 95, 0.25);
        }

        h1 {
            margin-bottom: 20px;
            color: #47796b;
        }

        #clock {
            font-size: 45px;
            font-weight: bold;
            letter-spacing: 3px;
            color: #3d7567;
            background: #d9f2e8;
            padding: 18px;
            border-radius: 12px;
        }

        p {
            color: #71978c;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="clock-box">

        <h1>Digital Clock</h1>

        <div id="clock"></div>

        <p>Current Time</p>

    </div>

    <script>

        function showClock() {

            var currentTime = new Date();

            var hour = currentTime.getHours();
            var minute = currentTime.getMinutes();
            var second = currentTime.getSeconds();

            if (hour < 10) {
                hour = "0" + hour;
            }

            if (minute < 10) {
                minute = "0" + minute;
            }

            if (second < 10) {
                second = "0" + second;
            }

            document.getElementById("clock").innerHTML =
                hour + ":" + minute + ":" + second;
        }

        showClock();

        setInterval(showClock, 1000);

    </script>

</body>

</html>
