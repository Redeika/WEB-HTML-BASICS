<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font Size Changer</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Trebuchet MS", sans-serif;
            background: #f6d7c3;
        }

        .card {
            width: 450px;
            padding: 35px;
            text-align: center;
            background: #fffaf6;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(130, 80, 50, 0.2);
        }

        h1 {
            color: #a5674d;
            margin-bottom: 25px;
            font-family: Georgia, serif;
        }

        #para1 {
            font-size: 17px;
            padding: 20px;
            background: #fbe5d6;
            color: #80543f;
            border-radius: 12px;
            cursor: pointer;
            transition: font-size 0.3s, background 0.3s;
        }

        #para1:hover {
            background: #f5d1bc;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>Change Font Size</h1>

        <p id="para1"
           onmouseover="increaseSize()"
           onmouseout="decreaseSize()">

            Move your mouse over this paragraph to zoom in.

        </p>

    </div>

    <script>

        function increaseSize() {
            document.getElementById("para1").style.fontSize = "28px";
        }

        function decreaseSize() {
            document.getElementById("para1").style.fontSize = "17px";
        }

    </script>

</body>

</html>
